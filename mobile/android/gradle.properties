org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental-compiler cache computes relative paths between the
# build output and plugin sources; when the project and the pub/Gradle caches
# live on different Windows drive letters that throws
# "this and base files have different roots" and the build fails. Disabling
# incremental compilation avoids it — only relevant to this local dev setup.
kotlin.incremental=false
