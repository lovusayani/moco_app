name: moco
description: Moco — per-minute paid social calling client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0

  # Models are plain Dart (see README — codegen removed deliberately)

  # Secure storage for the session token
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Realtime
  socket_io_client: ^2.0.3+1

  # Images
  cached_network_image: ^3.4.1

  # Calling (Phase 2)
  agora_rtc_engine: ^6.5.2
  permission_handler: ^11.3.1

  # Chat photo messages (Phase 3), feed post media (Phase 4)
  image_picker: ^1.1.2

  # Feed video posts (Phase 4). The official package — playback is driven by
  # the snap feed's current page index rather than a visibility library, so
  # exactly one controller is ever playing and the rule is testable.
  video_player: ^2.14.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
