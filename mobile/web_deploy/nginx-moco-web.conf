# nginx server block for the Moco PWA (Flutter web build).
#
# The PWA and the API share ONE origin: nginx serves the Flutter build at "/"
# and proxies /api and /socket.io to the Node backend. The client defaults to
# its own origin on web (lib/core/config/env.dart), so no CORS policy is needed
# on the backend and the session token never crosses origins.
#
# Install alongside (or instead of) moco-backend/nginx/moco.conf — the
# /api and /socket.io blocks below mirror that file:
#   flutter build web --release --dart-define=FLAVOR=production
#   sudo rsync -a --delete build/web/ /var/www/moco-web/
#   sudo cp web_deploy/nginx-moco-web.conf /etc/nginx/sites-available/moco-web
#   sudo ln -s /etc/nginx/sites-available/moco-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.example.com      # HTTPS is REQUIRED (see WEB.md)

upstream moco_api_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name app.example.com;  # replace with the real domain

    root /var/www/moco-web;
    server_tokens off;
    client_max_body_size 2m;

    # Media uploads go browser -> Supabase directly (signed URLs); only JSON
    # reaches the API, so the small body limit above is intentional.

    location /api/ {
        proxy_pass http://moco_api_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location /socket.io/ {
        proxy_pass http://moco_api_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Flutter's build output is NOT content-hashed (main.dart.js, canvaskit/
    # keep their names across builds), so everything revalidates on each
    # load. A 304 costs a round trip, not a download; sw.js covers offline.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Path-based routing (/chat/12): unknown paths get the app shell so a
        # refresh or deep link opens the right screen; the Flutter router shows
        # its own "Page not found" for paths it does not know.
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
        default_type application/manifest+json;
    }

    location ~* \.wasm$ {
        add_header Cache-Control "no-cache" always;
        default_type application/wasm;
    }
}
