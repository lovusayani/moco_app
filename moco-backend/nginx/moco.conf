# nginx reverse proxy for the Moco API on a DigitalOcean droplet.
#
# Install:
#   sudo cp nginx/moco.conf /etc/nginx/sites-available/moco
#   sudo ln -s /etc/nginx/sites-available/moco /etc/nginx/sites-enabled/moco
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run `sudo certbot --nginx -d api.yourdomain.com` once a domain is
# attached. Certbot rewrites the server block below with the certificate paths
# and adds the port 80 redirect.

upstream moco_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Rate limiting at the edge, in front of the application's own limiter. This
# one exists to shed obvious floods before they cost a Node process anything.
limit_req_zone $binary_remote_addr zone=moco_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=moco_auth_limit:10m rate=1r/s;

server {
    listen 80;
    server_name api.example.com;  # replace with the real domain

    client_max_body_size 2m;

    # Do not advertise the nginx version.
    server_tokens off;

    access_log /var/log/nginx/moco-access.log;
    error_log  /var/log/nginx/moco-error.log;

    location /health {
        proxy_pass http://moco_api;
        access_log off;
    }

    # OTP endpoints get a tighter bucket: they cost real money in SMS fees.
    location /api/auth/ {
        limit_req zone=moco_auth_limit burst=5 nodelay;
        proxy_pass http://moco_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs the upgrade headers and a long read timeout, or a quiet
    # call would have its socket closed mid-conversation.
    location /socket.io/ {
        proxy_pass http://moco_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=moco_api_limit burst=40 nodelay;
        proxy_pass http://moco_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app trusts this header for rate limiting, so nginx must set it
        # rather than pass through whatever the client claimed.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
