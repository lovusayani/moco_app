# nginx reverse proxy for the Moco API on a DigitalOcean droplet.
#
# Install:
#   sudo cp nginx/moco.conf /etc/nginx/sites-available/moco
#   sudo ln -s /etc/nginx/sites-available/moco /etc/nginx/sites-enabled/moco
#   sudo cp nginx/moco-edge-secret.conf.example /etc/nginx/moco-edge-secret.conf
#   sudo nano /etc/nginx/moco-edge-secret.conf     # paste the real secret
#   sudo chmod 600 /etc/nginx/moco-edge-secret.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: run `sudo certbot --nginx -d api.lovcamx.online` once DNS points here.
# Certbot rewrites the server block below with the certificate paths and adds
# the port 80 redirect.
#
# Who calls this host (see docs/DEPLOYMENT-VERCEL.md):
#   * the Android app — directly;
#   * the web PWA (lovcamx.online) and the admin console (admin.lovcamx.online)
#     — /api/* through a small Vercel Function proxy (api/moco-proxy.mjs in
#     each project), Socket.IO directly (Vercel cannot proxy WebSockets).

upstream moco_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Real client IP ----------------------------------------------------------
# Requests proxied by Vercel arrive from the proxy function's IP, which is
# shared by many users, so rate limits keyed on it would throttle every web
# user together. The function sends X-Forwarded-For with the client IP that
# Vercel reported (Vercel overwrites any client-sent value), plus
# X-Moco-Edge-Secret read from its server-side env. Only a request carrying
# that secret gets its X-Forwarded-For trusted, so anyone calling this host
# directly cannot spoof an IP to dodge the OTP limits.
#
# moco-edge-secret.conf (NOT in git; template: moco-edge-secret.conf.example)
# defines $moco_via_edge: 1 when the header matches the secret, else 0.
include /etc/nginx/moco-edge-secret.conf;

map "$moco_via_edge|$http_x_forwarded_for" $moco_client_ip {
    default                                   $remote_addr;
    "~^1\|\s*(?<moco_edge_client>[^,\s]+)"    $moco_edge_client;
}

# Rate limiting at the edge, in front of the application's own limiter. This
# one exists to shed obvious floods before they cost a Node process anything.
limit_req_zone $moco_client_ip zone=moco_api_limit:10m rate=20r/s;
limit_req_zone $moco_client_ip zone=moco_auth_limit:10m rate=1r/s;

server {
    listen 80;
    server_name api.lovcamx.online;

    client_max_body_size 2m;

    # Do not advertise the nginx version.
    server_tokens off;

    access_log /var/log/nginx/moco-access.log;
    error_log  /var/log/nginx/moco-error.log;

    location /health {
        proxy_pass http://moco_api;
        access_log off;
    }

    # OTP endpoints get a tighter bucket: they cost real money in SMS fees.
    location /api/auth/ {
        limit_req zone=moco_auth_limit burst=5 nodelay;
        proxy_pass http://moco_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Express trusts one proxy hop, so the value set here becomes req.ip.
        # It is always a single address: the verified edge client or the peer.
        proxy_set_header X-Forwarded-For $moco_client_ip;
        proxy_set_header X-Real-IP $moco_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Moco-Edge-Secret "";
        proxy_set_header Connection "";
    }

    # Socket.IO needs the upgrade headers and a long read timeout, or a quiet
    # call would have its socket closed mid-conversation. Browsers connect
    # here directly (cross-origin WebSocket; the socket authenticates with the
    # session token, not cookies).
    location /socket.io/ {
        proxy_pass http://moco_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=moco_api_limit burst=40 nodelay;
        proxy_pass http://moco_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts this header for rate limiting, so nginx must set it
        # rather than pass through whatever the client claimed.
        proxy_set_header X-Forwarded-For $moco_client_ip;
        proxy_set_header X-Real-IP $moco_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Moco-Edge-Secret "";
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
