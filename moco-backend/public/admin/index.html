<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moco Admin</title>
  <!-- Inline so the console makes no extra request and cannot 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e54f9a'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Login. Reuses the ordinary OTP flow; the admin allow-list is enforced
     server-side on every /api/admin request, so signing in here grants
     nothing by itself. -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-name">Moco Admin</div>
    </div>
    <p class="login-sub">Sign in with your admin email address or phone number.</p>

    <div id="login-error" class="error-msg" hidden></div>

    <form id="phone-form">
      <div class="field">
        <label for="login-email">Email or phone</label>
        <input id="login-email" type="text" inputmode="email" placeholder="admin@example.com or +919876543210" autocomplete="username" required>
      </div>
      <button class="btn-primary" type="submit">Send code</button>
    </form>

    <form id="code-form" hidden>
      <div class="field">
        <label for="code">Verification code</label>
        <input id="code" inputmode="numeric" maxlength="8" placeholder="000000" required>
      </div>
      <button class="btn-primary" type="submit">Verify</button>
      <button class="btn-ghost" type="button" id="back-btn" style="width:100%;margin-top:8px">Use a different email or phone</button>
    </form>

    <p class="hint">Access is limited to the server's admin allow-list (ADMIN_EMAILS / ADMIN_PHONES).</p>
  </div>
</div>

<!-- Console -->
<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">M</div>
      <div class="brand-name">Moco Admin</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      Signed in as
      <strong id="admin-phone"></strong>
      <button class="btn-ghost btn-sm" id="logout-btn" style="margin-top:8px;width:100%">Sign out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>

<script src="admin.js"></script>
</body>
</html>
